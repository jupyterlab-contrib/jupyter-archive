[build-system]
requires = ["hatchling>=1.5.0", "hatch-nodejs-version>=0.3.2", "jupyter-builder>=1.0.0,<2"]
build-backend = "hatchling.build"

[project]
name = "jupyter-archive"
readme = "README.md"
license = { file = "LICENSE" }
# Extraction relies on the tarfile "data" filter (PEP 706). It was added in 3.12 and backported to 3.10.12 / 3.11.4, but until 3.10.18 / 3.11.13 / 3.12.11 / 3.13.4 it could be bypassed with crafted symlinks and hard links
# https://github.com/google/security-research/security/advisories/GHSA-hgqp-3mmf-7h8f
requires-python = ">=3.10.18,!=3.11.0.*,!=3.11.1.*,!=3.11.2.*,!=3.11.3.*,!=3.11.4.*,!=3.11.5.*,!=3.11.6.*,!=3.11.7.*,!=3.11.8.*,!=3.11.9.*,!=3.11.10.*,!=3.11.11.*,!=3.11.12.*,!=3.12.0.*,!=3.12.1.*,!=3.12.2.*,!=3.12.3.*,!=3.12.4.*,!=3.12.5.*,!=3.12.6.*,!=3.12.7.*,!=3.12.8.*,!=3.12.9.*,!=3.12.10.*,!=3.13.0.*,!=3.13.1.*,!=3.13.2.*,!=3.13.3.*"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 3",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "jupyter_server>=1.21,<3"
]
dynamic = ["version", "description", "authors", "urls", "keywords"]

[project.optional-dependencies]
test = [
    "coverage",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-jupyter[server]>=0.6.0"
]
dev = [
    "jupyterlab>=4",
    "jupyter-builder>=1.0.0",
]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls", "keywords"]

[tool.hatch.build.targets.sdist]
artifacts = ["jupyter_archive/labextension"]
exclude = [".github", "binder"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyter_archive/labextension" = "share/jupyter/labextensions/@hadim/jupyter-archive"
"install.json" = "share/jupyter/labextensions/@hadim/jupyter-archive/install.json"
"jupyter-config/server-config" = "etc/jupyter/jupyter_server_config.d"

[tool.hatch.build.hooks.version]
path = "jupyter_archive/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "jupyter_archive/labextension/static/style.js",
    "jupyter_archive/labextension/package.json",
]
skip-if-exists = ["jupyter_archive/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "jupyter_archive/labextension"

[tool.jupyter-releaser.options]
version_cmd = "hatch version"

[tool.jupyter-releaser.hooks]
before-build-npm = [
    "python -m pip install 'jupyter-builder>=1.0.0,<2'",
    "jlpm",
    "jlpm build:prod"
]
before-build-python = ["jlpm clean:all"]

[tool.check-wheel-contents]
ignore = ["W002"]
